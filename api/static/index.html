<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBT Vision Search - AI Challenge 2026</title>
    <meta name="description" content="Hệ thống truy vết khoảnh khắc video sử dụng AI - AI Challenge 2026">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
    <!-- Header -->
    <header class="navbar">
        <div class="nav-brand">
            <span class="glow-text">EBT Vision Search</span>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link active">Tìm kiếm</a>
            <a href="algorithm.html" class="nav-link">Thuật toán &amp; Cơ chế chấm</a>
        </nav>
        <div class="system-status">
            <span class="status-dot online" id="status-dot"></span>
            <span class="status-text" id="status-text">Đang kiểm tra...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Search Section -->
        <section class="search-section">
            <div class="search-container glass-panel">
                <div class="query-types">
                    <button type="button" class="type-btn query-type-btn active" data-type="KIS" onclick="window.switchTrack('KIS');">KIS</button>
                    <button type="button" class="type-btn query-type-btn" data-type="QA" onclick="window.switchTrack('QA');">Q&amp;A</button>
                    <button type="button" class="type-btn query-type-btn" data-type="TRAKE" onclick="window.switchTrack('TRAKE');">TRAKE</button>
                </div>
                
                <form id="search-form" class="input-group" onsubmit="event.preventDefault(); window.performSearch();">
                    <input type="text" id="search-input" class="search-input" placeholder="Nhập truy vấn (Tiếng Việt / English)... VD: a man in a red shirt / người đàn ông áo đỏ" autocomplete="off">
                    <button id="search-btn" type="submit" class="search-btn">
                        <span class="btn-text">Tìm kiếm</span>
                        <div class="loader hidden"></div>
                    </button>
                </form>
                
                <div class="dataset-stats">
                    Dữ liệu: <span class="mono">177,321</span> keyframes | <span class="mono">873</span> videos | 🌐 Bi-lingual (VIE/ENG) | CLIP ViT-B/32
                </div>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loading-state" class="loading-state" style="display:none;">
            <div class="spinner"></div>
            <p id="loading-status-text">Đang tìm kiếm...</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="error-state" style="display:none;">
            <p id="error-message" class="error-text"></p>
            <button id="retry-btn" type="button" class="secondary-btn">Thử lại</button>
        </div>

        <!-- Results Section -->
        <section class="results-section" id="results-container" style="display:none;">
            <!-- Summary Bar -->
            <div class="results-summary glass-panel" id="summary-bar"></div>
            
            <!-- Parsed Info -->
            <div class="parsed-info glass-panel" id="parsed-info" style="display:none;"></div>
            
            <!-- Results Grid (dynamically populated by app.js) -->
            <div class="results-grid" id="results-grid"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="glass-footer">
        <p>EBT Project 2026 &mdash; AI Challenge | Powered by CLIP + Gemini + FAISS</p>
    </footer>

    <script src="app.js?v=7"></script>
</body>
</html>
