# EBT 2026 Project Configuration File
# ===================================

project:
  name: "EBT_Project_2026"
  version: "1.0.0"
  description: "AI Challenge 2026 - Video Retrieval, TRAKE & Q&A"

paths:
  raw_data_dir: "data/raw"
  videos_dir: "data/raw/videos"
  keyframes_dir: "data/raw/keyframes"
  objects_dir: "data/raw/objects"
  metadata_dir: "data/raw/metadata"
  zips_dir: "data/zips"
  
  processed_dir: "data/processed"
  metadata_db: "data/processed/metadata.db"
  faiss_index_dir: "data/processed/faiss_index"
  cache_dir: "data/processed/cache"
  
  outputs_dir: "outputs"
  verdicts_dir: "outputs/verdicts"
  reviews_dir: "outputs/reviews"
  traces_dir: "outputs/traces"

models:
  siglip2:
    model_name: "google/siglip2-base-patch16-224"
    dimension: 768
    device: "cuda"  # fallback to 'cpu' if no GPU available
  faster_rcnn:
    confidence_threshold: 0.3
    max_entities: 584
  vlm:
    provider: "gemini"
    model_name: "gemini-1.5-flash"
    batch_top_k: 5
    cache_enabled: true

retrieval:
  top_k_retrieve: 500
  top_k_submit: 100
  top_k_review: 20

scoring:
  baseline_weights:
    w_clip: 1.00
    w_obj: 0.50
    w_spatial: 0.50
  nms_min_seconds: 5.0
  nms_penalty: 1.0

ranking:
  strategy: "diversify"
  five_budget_max_videos: 4
  cluster_gap_threshold: 15
